<!DOCTYPE html>
<html>
<head>
    <title>Advanced Realistic 2D Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: black;
        }

        canvas {
            display: block;
            margin: auto;
            background: black;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

canvas.width = 900;
canvas.height = 500;

// ================= PLAYER =================
const player = {
    x: canvas.width / 2,
    y: canvas.height - 90,
    width: 50,
    height: 50,
    velocityX: 0,
    acceleration: 0.8,
    friction: 0.90,
    maxSpeed: 8,
    health: 3,
    shield: false
};

// ================= GAME =================
let keys = {};
let score = 0;
let gameOver = false;
let gameStarted = false;

let obstacles = [];
let particles = [];
let powerUps = [];

let spawnRate = 1000;
let lastSpawn = 0;

// ================= CONTROLS =================
document.addEventListener("keydown", (e) => {
    keys[e.key] = true;

    if (!gameStarted && e.key === "Enter") {
        gameStarted = true;
    }

    if (gameOver && e.key === "r") {
        location.reload();
    }
});

document.addEventListener("keyup", (e) => {
    keys[e.key] = false;
});

// ================= BACKGROUND STARS =================
let stars = [];

for (let i = 0; i < 100; i++) {
    stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 2,
        speed: Math.random() * 2
    });
}

function drawStars() {
    ctx.fillStyle = "white";

    stars.forEach(star => {
        star.y += star.speed;

        if (star.y > canvas.height) {
            star.y = 0;
            star.x = Math.random() * canvas.width;
        }

        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fill();
    });
}

// ================= PARTICLES =================
function createParticles(x, y, color) {
    for (let i = 0; i < 15; i++) {
        particles.push({
            x,
            y,
            dx: (Math.random() - 0.5) * 6,
            dy: (Math.random() - 0.5) * 6,
            size: Math.random() * 5,
            color,
            life: 50
        });
    }
}

function updateParticles() {
    particles.forEach((p, i) => {
        p.x += p.dx;
        p.y += p.dy;
        p.life--;

        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();

        if (p.life <= 0) {
            particles.splice(i, 1);
        }
    });
}

// ================= SPAWNERS =================
function spawnObstacle() {
    obstacles.push({
        x: Math.random() * (canvas.width - 40),
        y: -40,
        size: 30 + Math.random() * 30,
        speed: 3 + Math.random() * 4
    });
}

function spawnPowerUp() {
    powerUps.push({
        x: Math.random() * (canvas.width - 30),
        y: -30,
        size: 30,
        speed: 3
    });
}

// ================= UPDATE =================
function update(time) {
    if (!gameStarted || gameOver) return;

    // PLAYER MOVEMENT
    if (keys["ArrowLeft"] || keys["a"]) {
        player.velocityX -= player.acceleration;
    }

    if (keys["ArrowRight"] || keys["d"]) {
        player.velocityX += player.acceleration;
    }

    player.velocityX *= player.friction;

    if (player.velocityX > player.maxSpeed)
        player.velocityX = player.maxSpeed;

    if (player.velocityX < -player.maxSpeed)
        player.velocityX = -player.maxSpeed;

    player.x += player.velocityX;

    // WALL COLLISION
    player.x = Math.max(
        0,
        Math.min(canvas.width - player.width, player.x)
    );

    // OBSTACLE SPAWN
    if (time - lastSpawn > spawnRate) {
        spawnObstacle();

        if (Math.random() < 0.15) {
            spawnPowerUp();
        }

        lastSpawn = time;

        // Increase difficulty
        if (spawnRate > 250) {
            spawnRate -= 15;
        }
    }

    // UPDATE OBSTACLES
    obstacles.forEach((o, index) => {
        o.y += o.speed;

        // Collision
        if (
            player.x < o.x + o.size &&
            player.x + player.width > o.x &&
            player.y < o.y + o.size &&
            player.height + player.y > o.y
        ) {
            createParticles(player.x, player.y, "red");

            if (!player.shield) {
                player.health--;
            }

            player.shield = false;
            obstacles.splice(index, 1);

            if (player.health <= 0) {
                gameOver = true;
            }
        }
    });

    // POWERUP COLLISION
    powerUps.forEach((p, index) => {
        p.y += p.speed;

        if (
            player.x < p.x + p.size &&
            player.x + player.width > p.x &&
            player.y < p.y + p.size &&
            player.height + player.y > p.y
        ) {
            player.shield = true;
            createParticles(p.x, p.y, "cyan");
            powerUps.splice(index, 1);
        }
    });

    score++;
}

// ================= DRAW =================
function draw() {

    // Background
    let gradient = ctx.createLinearGradient(0,0,0,canvas.height);
    gradient.addColorStop(0, "#050d1a");
    gradient.addColorStop(1, "#112240");

    ctx.fillStyle = gradient;
    ctx.fillRect(0,0,canvas.width,canvas.height);

    drawStars();

    // Player glow
    ctx.save();

    ctx.shadowBlur = 25;
    ctx.shadowColor = player.shield ? "yellow" : "cyan";

    ctx.fillStyle = player.shield ? "gold" : "cyan";

    ctx.beginPath();
    ctx.roundRect(
        player.x,
        player.y,
        player.width,
        player.height,
        12
    );
    ctx.fill();

    ctx.restore();

    // Obstacles
    obstacles.forEach(o => {
        ctx.fillStyle = "crimson";

        ctx.beginPath();
        ctx.arc(
            o.x + o.size/2,
            o.y + o.size/2,
            o.size/2,
            0,
            Math.PI * 2
        );
        ctx.fill();
    });

    // PowerUps
    powerUps.forEach(p => {
        ctx.fillStyle = "yellow";

        ctx.beginPath();
        ctx.arc(
            p.x + p.size/2,
            p.y + p.size/2,
            p.size/2,
            0,
            Math.PI * 2
        );
        ctx.fill();
    });

    updateParticles();

    // UI
    ctx.fillStyle = "white";
    ctx.font = "24px Arial";
    ctx.fillText("Score: " + score, 20, 40);
    ctx.fillText("Health: " + player.health, 20, 75);

    if (player.shield) {
        ctx.fillStyle = "yellow";
        ctx.fillText("Shield Active", 20, 110);
    }

    // Start screen
    if (!gameStarted) {
        ctx.fillStyle = "white";
        ctx.font = "40px Arial";
        ctx.fillText(
            "Press ENTER to Start",
            canvas.width/2 - 200,
            canvas.height/2
        );
    }

    // Game over
    if (gameOver) {
        ctx.fillStyle = "red";
        ctx.font = "50px Arial";
        ctx.fillText(
            "GAME OVER",
            canvas.width/2 - 170,
            canvas.height/2
        );

        ctx.font = "30px Arial";
        ctx.fillStyle = "white";
        ctx.fillText(
            "Press R to Restart",
            canvas.width/2 - 150,
            canvas.height/2 + 60
        );
    }
}

// ================= GAME LOOP =================
function gameLoop(time = 0) {
    update(time);
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
